[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
common = { path = "../common" }
dotenvy = { workspace = true }
nix = { version = "0.27", features = ["process", "sched", "mount", "uio", "hostname"] }
